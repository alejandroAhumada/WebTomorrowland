name: Deploy Tomorrowland Sync API

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Private Sync API function to deploy
        required: true
        type: choice
        options: [syncTomorrowlandEvent, syncTomorrowlandPlan]
        default: syncTomorrowlandEvent

permissions:
  contents: read

concurrency:
  group: deploy-tomorrowland-sync-api
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:functions
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUNCTIONS_DEPLOY }}
          project_id: web-pack-tomorrowland
      - name: Deploy private 2nd gen function
        run: npx --yes firebase-tools@15.28.1 deploy --only functions:tomorrowland-sync:${{ inputs.function_name }} --project web-pack-tomorrowland --non-interactive
